name: Feature request
description: Propose a research or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Research or usability need
      description: Describe the decision or task, not only the proposed control.
    validations:
      required: true
  - type: textarea
    id: interaction
    attributes:
      label: Suggested interaction or output
    validations:
      required: true
  - type: textarea
    id: data_source
    attributes:
      label: Required public data source and licence/terms context
  - type: dropdown
    id: metric_change
    attributes:
      label: Would this change a metric definition or aggregation?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Project boundary
      options:
        - label: This request does not require broker login, credential storage, order execution, or autonomous trading.
          required: true
