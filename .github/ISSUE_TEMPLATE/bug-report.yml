name: Bug report
description: Report a reproducible application or packaging defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach a complete data directory, database, raw FCA file, Yahoo cache, ticker mapping, credential, or unredacted log. Security vulnerabilities must follow SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Short Tracker version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - GitHub Windows ZIP
        - Source checkout
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows or operating-system version and architecture
      placeholder: "Windows 11 x64"
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Application surface
      placeholder: "Windows desktop (WebView2), or source-mode browser and version"
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or public identifiers and the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour and redacted diagnostic excerpt
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach `data/`, SQLite/WAL/SHM, raw FCA files, Yahoo cache, ticker mappings, credentials, personal financial information, or an unredacted log.
          required: true
