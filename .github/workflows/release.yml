name: Draft Windows release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up locked uv-managed Python 3.11.15 x64
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          python-version: "3.11.15"
          activate-environment: true
          venv-path: .build-venv
          no-project: true
          enable-cache: true
          cache-python: true
          cache-dependency-glob: requirements-build.lock
      - name: Require a real project licence
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath ./LICENSE -PathType Leaf)) {
            throw 'LICENSE is required before a public GitHub Release.'
          }
          if ((Get-Item -LiteralPath ./LICENSE).Length -lt 200) {
            throw 'LICENSE is unexpectedly short and may be a placeholder.'
          }
      - name: Verify public-release configuration
        shell: pwsh
        run: >-
          python -m tools.verify_publication_config
          --root .
          --github-repository "${{ github.repository }}"
      - name: Install locked build dependencies
        run: uv pip install --python .build-venv/Scripts/python.exe --require-hashes -r requirements-build.lock
      - name: Verify tag, source version, and changelog
        shell: pwsh
        run: python -m tools.verify_version --root . --tag "${{ github.ref_name }}"
      - name: Build and verify Windows release
        shell: pwsh
        run: ./packaging/Build-WindowsRelease.ps1
      - name: Verify frozen runtime without Python on PATH
        shell: pwsh
        run: |
          $archive = (Get-ChildItem -LiteralPath dist -Filter 'Short-Tracker-*-windows-x64.zip' -File | Select-Object -First 1).FullName
          ./packaging/Test-NoPythonRuntime.ps1 -Archive $archive
      - name: Attest release ZIP provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Short-Tracker-*-windows-x64.zip
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/Short-Tracker-*-windows-x64.zip
            dist/Short-Tracker-*-windows-x64.zip.sha256
            dist/release-manifest-*.json
          if-no-files-found: error
          retention-days: 30

  create-draft-release:
    needs: build-and-attest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out tagged source for release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Reverify the exact draft release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          zip="release-assets/Short-Tracker-v${version}-windows-x64.zip"
          checksum="${zip}.sha256"
          manifest="release-assets/release-manifest-v${version}.json"

          mapfile -t files < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(
            "Short-Tracker-v${version}-windows-x64.zip"
            "Short-Tracker-v${version}-windows-x64.zip.sha256"
            "release-manifest-v${version}.json"
          )
          if [[ "${files[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected release asset set:\n%s\n' "${files[*]}" >&2
            exit 1
          fi

          # The Windows packager writes a CRLF checksum file. Strip CR before
          # comparing fields on the Linux draft-release runner.
          expected_hash="$(awk 'NR == 1 { print $1 }' "$checksum" | tr -d '\r')"
          expected_name="$(awk 'NR == 1 { print $2 }' "$checksum" | tr -d '\r')"
          actual_hash="$(sha256sum "$zip" | awk '{ print $1 }')"
          if [[ "$expected_hash" != "$actual_hash" || "$expected_name" != "$(basename "$zip")" ]]; then
            echo 'Release checksum or filename does not match.' >&2
            exit 1
          fi

          python3 -m tools.verify_release_archive "$zip"
          python3 - "$manifest" "$version" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected_version = sys.argv[2]
          checks = {
              "version": payload.get("version") == expected_version,
              "channel": payload.get("channel") == "stable",
              "data_included": payload.get("data_included") is False,
              "code_signed": payload.get("code_signed") is False,
              "git_commit": payload.get("build", {}).get("git_commit")
              == __import__("os").environ["GITHUB_SHA"],
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Release manifest checks failed: " + ", ".join(failed))
          PY
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "release-assets/Short-Tracker-v${version}-windows-x64.zip" \
            "release-assets/Short-Tracker-v${version}-windows-x64.zip.sha256" \
            "release-assets/release-manifest-v${version}.json" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "Short Tracker ${GITHUB_REF_NAME}"
