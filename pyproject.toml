[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uk-short-tracker"
dynamic = ["version"]
description = "A local dashboard for UK public net short position disclosures."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = [
  "openpyxl>=3.1,<4",
  "pywebview>=6.2,<7; sys_platform == 'win32'",
  "pythonnet>=3.1,<4; sys_platform == 'win32'",
]
keywords = [
  "short-selling",
  "FCA",
  "UK equities",
  "financial data",
  "dashboard",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://ukshort.com"
Repository = "https://github.com/ClydeKingsley/uk-short-tracker"
Issues = "https://github.com/ClydeKingsley/uk-short-tracker/issues"

[project.optional-dependencies]
build = [
  "Pillow==12.3.0",
  "pyinstaller==6.22.2",
  "pywebview==6.2.1; sys_platform == 'win32'",
  "pythonnet==3.1.0; sys_platform == 'win32'",
]

[project.scripts]
short-tracker = "short_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["short_tracker*", "launcher*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "short_tracker.__version__"}
